<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Halalzur — Məhsul</title>
<meta name="description" content="Halalzur ilə bu məhsulun halal statusunu yoxla." />
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6FBF7;
    --ink: #10241A;
    --ink-muted: #52685C;
    --brand-dark: #0A4D2E;
    --brand: #119E4B;
    --brand-accent: #7CFC00;
    --brand-surface: #E8F7ED;
    --card: #FFFFFF;
    --border: #DDEFE2;
    --halal: #119E4B;
    --mushbooh: #B7791F;
    --mushbooh-bg: #FBF3DF;
    --haram: #C0362C;
    --haram-bg: #FBE7E5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1712;
      --ink: #EAF3EC;
      --ink-muted: #8FA79A;
      --card: #112420;
      --border: #1C3A2E;
      --brand-surface: #10281F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1712;
    --ink: #EAF3EC;
    --ink-muted: #8FA79A;
    --card: #112420;
    --border: #1C3A2E;
    --brand-surface: #10281F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1, h2 { font-family: "Manrope", sans-serif; text-wrap: balance; margin: 0; }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(10, 77, 46, 0.08);
  }
  .logo {
    width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 18px;
    display: block; object-fit: cover;
  }
  .eyebrow {
    display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
    color: var(--brand-dark); background: var(--brand-surface); padding: 5px 12px; border-radius: 999px;
    margin-bottom: 14px;
  }
  h1 { font-size: 22px; line-height: 1.3; color: var(--ink); }
  .brand-line { color: var(--ink-muted); font-size: 14px; margin-top: 6px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13.5px;
    padding: 7px 16px; border-radius: 999px; margin: 16px 0;
  }
  .status-halal { background: var(--brand-surface); color: var(--halal); }
  .status-mushbooh { background: var(--mushbooh-bg); color: var(--mushbooh); }
  .status-haram { background: var(--haram-bg); color: var(--haram); }
  .status-unknown { background: var(--mushbooh-bg); color: var(--mushbooh); }
  .lede { color: var(--ink-muted); font-size: 15px; line-height: 1.55; margin: 4px 0 24px; }
  .btn-row { display: flex; flex-direction: column; gap: 10px; }
  .primary-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--brand-dark); color: #fff; text-decoration: none;
    font-weight: 700; font-size: 15px; padding: 14px 20px; border-radius: 14px; font-family: inherit;
  }
  .secondary-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; color: var(--brand-dark); text-decoration: none; border: 1.5px solid var(--border);
    font-weight: 700; font-size: 14px; padding: 12px 20px; border-radius: 14px;
  }
  .loading { color: var(--ink-muted); font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Halalzur" />
    <div class="eyebrow">HALAL STATUSU</div>
    <div id="content">
      <p class="loading">Yüklənir…</p>
    </div>
  </div>

  <script>
    // APP_STORE_URL placeholder — replace once Halalzur is published, same as index.html's #navStoreLink.
    var APP_STORE_URL = "#";
    var SUPABASE_URL = "https://szizepjcospoygnjmxwz.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_YSxBg5SQveiZrRU6H65mVg_Ea4gp2Pl";

    var STATUS_LABEL = {
      halal: { emoji: "🟢", text: "Halal", cls: "status-halal" },
      mushbooh: { emoji: "🟡", text: "Şübhəli", cls: "status-mushbooh" },
      haram: { emoji: "🔴", text: "Tövsiyə edilmir", cls: "status-haram" },
      unknown: { emoji: "🟡", text: "Naməlum", cls: "status-unknown" },
    };

    function esc(s) {
      var div = document.createElement("div");
      div.textContent = s == null ? "" : String(s);
      return div.innerHTML;
    }

    function renderButtons(barcode) {
      var openAppHref = "halalzur://product/" + encodeURIComponent(barcode);
      return (
        '<div class="btn-row">' +
          '<a class="primary-btn" href="' + openAppHref + '">Tətbiqdə aç</a>' +
          '<a class="secondary-btn" href="' + APP_STORE_URL + '">Halalzur-u yüklə</a>' +
        '</div>'
      );
    }

    var params = new URLSearchParams(window.location.search);
    var barcode = (params.get("barcode") || "").trim();
    var contentEl = document.getElementById("content");

    if (!barcode) {
      contentEl.innerHTML =
        '<h1>Barkod göstərilməyib</h1>' +
        '<p class="lede">Bu linkdə barkod məlumatı yoxdur.</p>' +
        renderButtons("");
    } else {
      fetch(
        SUPABASE_URL + "/rest/v1/certified_entries?select=product_name,brand,status&barcode=eq." +
          encodeURIComponent(barcode) + "&entry_type=eq.product&deleted_at=is.null&limit=1",
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } }
      )
        .then(function (res) { return res.ok ? res.json() : []; })
        .then(function (rows) {
          var row = rows && rows[0];
          if (!row) {
            contentEl.innerHTML =
              '<h1>Bu məhsul hələ bazamızda yoxdur</h1>' +
              '<p class="lede">Tətbiqdə skan edərək əlavə edə bilərsiniz.</p>' +
              renderButtons(barcode);
            return;
          }
          var status = STATUS_LABEL[row.status] || STATUS_LABEL.unknown;
          contentEl.innerHTML =
            '<h1>' + esc(row.product_name || row.brand) + '</h1>' +
            '<div class="brand-line">' + esc(row.brand) + '</div>' +
            '<div class="status-pill ' + status.cls + '">' + status.emoji + ' ' + status.text + '</div>' +
            '<p class="lede">Tam sertifikat məlumatı, tərkib analizi və halal alternativlər üçün tətbiqdə aç.</p>' +
            renderButtons(barcode);
        })
        .catch(function () {
          contentEl.innerHTML =
            '<h1>Yüklənmədi</h1>' +
            '<p class="lede">Bir xəta baş verdi, tətbiqdə birbaşa yoxlaya bilərsiniz.</p>' +
            renderButtons(barcode);
        });
    }
  </script>
</body>
</html>
