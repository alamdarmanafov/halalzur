<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #F6FAF7;
    --surface: #FFFFFF;
    --ink: #10241A;
    --ink-muted: #52685C;
    --border: #E1EAE4;
    --brand-dark: #0A4D2E;
    --brand: #119E4B;
    --brand-accent: #7CFC00;
    --shadow-color: 16, 36, 26;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #081911;
      --surface: #0F1F17;
      --ink: #EAF3EC;
      --ink-muted: #8FA79A;
      --border: #1E3327;
      --shadow-color: 0, 0, 0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #081911;
    --surface: #0F1F17;
    --ink: #EAF3EC;
    --ink-muted: #8FA79A;
    --border: #1E3327;
    --shadow-color: 0, 0, 0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 32px 40px;
    box-shadow: 0 32px 64px -32px rgba(var(--shadow-color), 0.35);
  }

  .logo { width: 56px; height: 56px; border-radius: 16px; margin-bottom: 20px; }

  .code {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.14em;
    color: var(--brand);
    margin-bottom: 10px;
  }

  h1 {
    font-family: "Manrope", sans-serif;
    font-weight: 800;
    font-size: 24px;
    margin: 0 0 10px;
    text-wrap: balance;
  }

  p {
    margin: 0 0 28px;
    color: var(--ink-muted);
    font-size: 15px;
    line-height: 1.55;
  }

  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--brand-dark), var(--brand));
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 999px;
  }
</style>
</head>
<body>

<div class="card">
  <svg class="logo" viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0A4D2E"/><stop offset="55%" stop-color="#119E4B"/><stop offset="100%" stop-color="#7CFC00"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#lg)"/><rect x="35" y="26" width="11" height="48" fill="#fff"/><path d="M46 26 h8 v18 h4 v-18 h4 v22 h-16 z" fill="#fff"/><path d="M50 52 l11 13 l20 -26" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <div class="code">404</div>
  <h1>Bu səhifə tapılmadı</h1>
  <p>Axtardığın səhifə silinib və ya heç mövcud olmayıb. Ana səhifədən davam edə bilərsən.</p>
  <a class="btn" href="/">← Ana səhifəyə qayıt</a>
</div>

</body>
</html>
