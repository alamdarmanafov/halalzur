name: Send weekly community digest push

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly digest
        run: |
          curl -sf -X POST "${ADMIN_API_URL}/api/cron-jobs?job=weekly-digest" \
            -H "x-notify-secret: ${NOTIFY_SECRET}"
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
