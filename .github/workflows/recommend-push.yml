name: Send "might interest you" recommendation push

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger recommendation push
        run: |
          curl -sf -X POST "${ADMIN_API_URL}/api/cron-jobs?job=recommend" \
            -H "x-notify-secret: ${NOTIFY_SECRET}"
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
