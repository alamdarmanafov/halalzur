name: Send win-back push to inactive users

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger win-back push
        run: |
          curl -sf -X POST "${ADMIN_API_URL}/api/cron-jobs?job=win-back" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
