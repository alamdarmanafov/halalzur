name: Award monthly Halal Detektiv

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly detective award
        run: |
          curl -sf -X POST "${ADMIN_API_URL}/api/cron-jobs?job=monthly-detective" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
