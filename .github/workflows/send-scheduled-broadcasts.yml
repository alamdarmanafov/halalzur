name: Send scheduled push notifications

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scheduled-broadcast processing
        run: |
          curl -sf -X POST "${ADMIN_API_URL}/api/process-scheduled-broadcasts" \
            -H "x-cron-secret: ${CRON_SECRET}"
        env:
          ADMIN_API_URL: ${{ secrets.ADMIN_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
